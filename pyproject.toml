[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "graphrag"
version = "0.1.0"
description = "Multimodal GraphRAG - Financial Document QA System"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "redis>=5.0.0",
    "PyMuPDF>=1.24.0",
    "docling>=2.0.0",
    "sentence-transformers>=3.0.0",
    "pymilvus>=2.4.0",
    "elasticsearch>=8.14.0",
    "minio>=7.2.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "simhash>=2.1.0",
    "jieba>=0.42.1",
    "python-multipart>=0.0.9",
    "tenacity>=8.3.0",
    "loguru>=0.7.2",
    "aiofiles>=23.2.0",
    "torch>=2.5.0",
    "torchvision>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["graphrag*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true